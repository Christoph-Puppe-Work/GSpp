<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grundschutz++ OSCAL Tools</title>
  <style>
    :root {
      --bg: #0f172a; --bar: #1e293b; --bar2: #334155;
      --accent: #38bdf8; --accent2: #0ea5e9;
      --text: #e2e8f0; --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; background: var(--bar);
      border-bottom: 1px solid var(--bar2);
    }
    header .brand { font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
    header .brand span { color: var(--accent); }
    header .spacer { flex: 1; }
    header a.btn {
      color: var(--muted); text-decoration: none; font-size: 0.8rem;
      padding: 5px 10px; border: 1px solid var(--bar2); border-radius: 6px;
      white-space: nowrap;
    }
    header a.btn:hover { color: var(--text); border-color: var(--accent); }

    nav {
      display: flex; gap: 4px; padding: 6px 10px; background: var(--bar);
      border-bottom: 1px solid var(--bar2);
      overflow-x: auto; scrollbar-width: thin;
    }
    nav button {
      flex: 0 0 auto; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 1px solid transparent; border-radius: 8px;
      padding: 7px 13px; font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 7px; white-space: nowrap;
      transition: all .12s ease;
    }
    nav button:hover { color: var(--text); background: var(--bar2); }
    nav button.active {
      color: #04293a; background: var(--accent);
      box-shadow: 0 1px 6px rgba(56,189,248,.4);
    }
    nav button .ico { font-size: 1rem; }

    .frame-wrap { flex: 1; position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--muted); font-size: 0.9rem; gap: 10px;
      transition: opacity .2s; pointer-events: none;
    }
    #loading.hidden { opacity: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
      animation: pulse 1s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛡️ Grundschutz<span>++</span> OSCAL Tools</div>
    <div class="spacer"></div>
    <a class="btn" id="open-standalone" href="#" target="_blank" rel="noopener" title="Aktuelle App in neuem Tab öffnen">↗ Standalone</a>
    <a class="btn" href="https://github.com/NTT-Data-Deutschland-SE/Grundschutz-Plus-Plus-Tools" target="_blank" rel="noopener">GitHub</a>
  </header>

  <nav id="tabs" aria-label="Apps"></nav>

  <div class="frame-wrap">
    <div id="loading"><span class="dot"></span> Lade App…</div>
    <iframe id="app-frame" title="App" src="about:blank"></iframe>
  </div>

  <script>
    // Workflow order: Explorer → Profil-Erstellung → Modellierung → Umsetzung → Prüfung → Abarbeiten.
    const APPS = [
      { id: "explorer", icon: "📚", label: "Explorer",        file: "GSpp-Viewer.html",               desc: "BSI Grundschutz++ Katalog-Explorer" },
      { id: "bsi2gpp",  icon: "🧩", label: "BSI → G++ Profil", file: "Baustein_2_Profile.html",        desc: "BSI-Baustein (PDF) → OSCAL G++ Profil" },
      { id: "sspgen",   icon: "🏗️", label: "SSP-Generator",    file: "ssp_generator.html",             desc: "OSCAL Blaupausen & Risk Generator" },
      { id: "sspedit",  icon: "✍️", label: "SSP-Editor",       file: "ssp_ausfuellen.html",            desc: "OSCAL SSP ausfüllen / Workspace" },
      { id: "pruefung", icon: "🔍", label: "Prüfung (AP/AR)",  file: "pruefung_ap_ar.html",            desc: "Assessment Plan & Results Generator" },
      { id: "poam",     icon: "📋", label: "POA&M",            file: "abarbeiten_POAM_generator.html", desc: "POA&M Generator – Feststellungen abarbeiten" },
    ];

    const nav = document.getElementById("tabs");
    const frame = document.getElementById("app-frame");
    const loading = document.getElementById("loading");
    const standalone = document.getElementById("open-standalone");

    APPS.forEach(app => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = app.id;
      b.title = app.desc;
      b.innerHTML = `<span class="ico">${app.icon}</span>${app.label}`;
      b.addEventListener("click", () => select(app.id, true));
      nav.appendChild(b);
    });

    function select(id, push) {
      const app = APPS.find(a => a.id === id) || APPS[0];
      [...nav.children].forEach(b => {
        const on = b.dataset.id === app.id;
        b.classList.toggle("active", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      loading.classList.remove("hidden");
      frame.src = app.file;
      frame.title = app.desc;
      standalone.href = app.file;
      document.title = `${app.label} · Grundschutz++ OSCAL Tools`;
      if (push && location.hash.slice(1) !== app.id) {
        history.replaceState(null, "", "#" + app.id);
      }
    }

    frame.addEventListener("load", () => {
      if (frame.src !== "about:blank") loading.classList.add("hidden");
    });

    window.addEventListener("hashchange", () => select(location.hash.slice(1) || APPS[0].id, false));
    select(location.hash.slice(1) || APPS[0].id, false);
  </script>
</body>
</html>
