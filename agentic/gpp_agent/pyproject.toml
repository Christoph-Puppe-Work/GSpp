[project]
name = "gpp_agent"
version = "0.1.0"
description = "ADK-based multi-agent system for Grundschutz++ workflows"
authors = [
    { name = "gpp_agent Team" }
]
dependencies = [
    "google-adk[otel-gcp]>=1.32.0,<2.0.0",
    "google-cloud-storage>=2.0.0",
    "google-cloud-firestore>=2.11.0",
    "pydantic>=2.0.0",
    "mcp[cli]>=0.1.0",
    "pyyaml>=6.0.0",
    "opentelemetry-api>=1.20.0",
    "jsonschema>=4.0.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
